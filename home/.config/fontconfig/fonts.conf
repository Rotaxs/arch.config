<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- 无衬线 -->
 <alias binding="strong">
  <family>sans-serif</family>
  <prefer>
   <family>Noto Sans CJK SC</family>
  </prefer>
 </alias>
 <!-- 衬线 -->
 <alias binding="strong">
  <family>serif</family>
  <prefer>
   <family>Noto Serif CJK SC</family>
  </prefer>
 </alias>
 <!-- 等宽 -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>FiraCode Nerd Font Mono</string>
  </edit>
  <edit binding="strong" mode="append" name="family">
   <string>LXGW WenKai Mono</string>
  </edit>
  </match>
  <!-- JetBrains Mono lacks CJK glyphs; use LXGW WenKai in terminals. -->
  <match target="pattern">
   <test name="family" compare="eq">
    <string>JetBrains Mono</string>
   </test>
   <edit binding="strong" mode="append" name="family">
    <string>LXGW WenKai</string>
   </edit>
  </match>
  <match target="font">
  <edit mode="assign" name="rgba">
   <const>vbgr</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>vrgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>bgr</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
