# Minimal lock screen for niri.
# Colors follow the desktop palette in ~/.config/waybar/css/color.css.

$font = LXGW WenKai
$text = rgba(232, 232, 232, 1.0)
$muted = rgba(200, 204, 207, 0.85)
$surface = rgba(32, 32, 32, 0.72)
$border = rgba(178, 203, 224, 0.75)
$success = rgba(178, 203, 183, 0.90)
$danger = rgba(209, 139, 139, 0.90)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
    fail_timeout = 1800
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldFade, 1, 4, easeOut
    animation = inputFieldColors, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    color = rgba(17, 19, 21, 1.0)
    blur_size = 8
    blur_passes = 3
    noise = 0.008
    contrast = 0.92
    brightness = 0.64
    vibrancy = 0.12
    vibrancy_darkness = 0.15
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 185
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=zh_CN.UTF-8 date '+%Y 年 %m 月 %d 日 · %A'
    color = $muted
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.40)
    position = 0, 105
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -12
    halign = center
    valign = center
}

# Password card
input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    inner_color = $surface
    outer_color = $border
    check_color = $success
    fail_color = $danger
    capslock_color = rgba(212, 196, 146, 0.90)
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##c8cccf">输入密码以解锁</span>
    check_text = 正在验证…
    fail_text = 密码错误，请重试
    rounding = 18
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    fade_on_empty = false
    shadow_passes = 4
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.38)
    position = 0, -72
    halign = center
    valign = center
}

# Quiet keyboard hint
label {
    monitor =
    text = ESC 清空输入
    color = rgba(200, 204, 207, 0.62)
    font_size = 13
    font_family = $font
    position = 0, 38
    halign = center
    valign = bottom
}
