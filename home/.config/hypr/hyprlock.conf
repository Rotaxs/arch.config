# Shared by the wofi power menu and niri's lock shortcut.
$font = LXGW WenKai Medium

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    # Session-lock surfaces cannot show the live desktop underneath.
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgba(00000000)
}

label {
    monitor =
    text = $TIME
    color = rgb(e8e8e8)
    font_size = 110
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 440, 90
    outline_thickness = 2
    inner_color = rgb(2a2a2a)
    outer_color = rgb(505050)
    check_color = rgb(b2cbe0)
    fail_color = rgb(d18b8b)
    font_color = rgb(e8e8e8)
    font_family = $font
    placeholder_text = <span size="24000">输入密码解锁</span>
    fail_text = <span size="24000">$PAMFAIL</span>
    fade_on_empty = false
    rounding = 12
    dots_size = 0.3
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(a0a0a0)
    font_size = 32
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}
